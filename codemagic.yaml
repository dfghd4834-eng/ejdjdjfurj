workflows:
  smooth-player-android:
    name: Build Smooth Player APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Extract Android project
        script: |
          set -eu
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'smooth*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo 'Missing smooth*.zip in repository root'
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/project"
          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/project"
      - name: Build debug APK
        script: |
          set -eu
          cd "$CM_BUILD_DIR/project"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --console=plain
          else
            gradle assembleDebug --no-daemon --console=plain
          fi
    artifacts:
      - project/**/build/outputs/apk/debug/*.apk
